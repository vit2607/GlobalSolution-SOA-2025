# ====================================
# GLOBAL SOLUTION 2025 - UPSKILLING PLATFORM
# Configurações da Aplicação
# ====================================

# Configurações do Servidor
server.port=8080
spring.application.name=upskilling-platform

# ====================================
# OPÇÃO 1: H2 DATABASE (Padrão)
# ====================================
spring.datasource.url=jdbc:h2:mem:upskillingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console H2 (acesse em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====================================
# OPÇÃO 2: ORACLE DATABASE (Descomente para usar)
# ====================================
# Conexão Oracle FIAP (conforme imagem fornecida)
# spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
# spring.datasource.username=RMnnnnn
# spring.datasource.password=ddmmaa
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ====================================
# Configurações JPA/Hibernate
# ====================================
# create = cria schema automaticamente
# update = atualiza schema
# validate = valida schema
# none = não faz nada (usa apenas schema.sql)
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ====================================
# Configuração de Scripts SQL
# ====================================
# Inicializa o banco com schema.sql e data.sql
spring.sql.init.mode=always

# ====================================
# Swagger/OpenAPI Configuration
# ====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# ====================================
# Configurações de Validação
# ====================================
spring.jpa.properties.javax.persistence.validation.mode=auto

# ====================================
# Configurações de Logging
# ====================================
logging.level.br.com.fiap=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====================================
# Configurações de JSON
# ====================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
